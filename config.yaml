# DocLogs configuration

llm:
  provider: prompt_only

cursor:
  command: agent
  model: auto
  mode: ask
  trust_workspace: true
  timeout_seconds: 120

copilot:
  command: copilot
  model: auto
  timeout_seconds: 120

openai:
  model: gpt-4o-mini
  api_key: "${OPENAI_API_KEY}"

ollama:
  endpoint: http://127.0.0.1:11434
  model: "local-llm"

anthropic:
  model: claude-3
  api_key: "${ANTHROPIC_API_KEY}"

gemini:
  model: gemini-pro
  api_key: "${GEMINI_API_KEY}"

publish:
  repo: null
  branch: main
  remote: origin
  subdir: posts
